[package]
name = "portzap"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_NetworkManagement_IpHelper", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
