name: release

# Build release trên CI rồi đăng lên GitHub Releases khi push tag v*.
# Lý do có CI: máy dev bật Smart App Control (enforcement) chặn file PE build mới
# chưa ký (os error 4551) → `cargo build --release` không chạy được local.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # rustup tự đọc rust-toolchain.toml (pin 1.90) và tải khi cargo chạy
      - name: Show Rust toolchain
        run: rustup show

      - name: Check version đồng bộ (tag <-> Cargo.toml <-> tauri.conf.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $toml = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $conf = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=v$tag  Cargo.toml=$toml  tauri.conf.json=$conf"
          if ($toml -ne $conf) { throw "Cargo.toml ($toml) != tauri.conf.json ($conf)" }
          if ($toml -ne $tag)  { throw "tag v$tag != version $toml" }

      - name: cargo test
        run: cargo test

      - name: Package (build release + zip)
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: portzap-zip
          path: assets/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*.zip
          generate_release_notes: true
